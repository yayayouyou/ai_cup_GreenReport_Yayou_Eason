name: clean_text_esg_prefix
steps:
  - normalize_esg_type:
      sort_labels: true
  - fill_empty_esg_type:
      fill_value: "Unknown"
  - normalize_timeline:
      rename: {}
  - clean_text:           # 先清文本
      field: data
  - add_esg_prefix:       # 再加前綴（prefix 本身不含 markdown，不需再 clean）
      template: "[{esg_type}]"
