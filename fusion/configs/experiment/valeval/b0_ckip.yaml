name: valeval_b0_ckip
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train_file: "data/raw/vpesg_4k_train_1000.json"
  val_file:   "data/raw/vpesg4k_val_1000.json"
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  seed: 42
output_dir: experiments/valeval_b0_ckip
