name: valeval_bgem3
model:      configs/model/bge_m3.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train_file: "data/raw/vpesg_4k_train_1000.json"
  val_file:   "data/raw/vpesg4k_val_1000.json"
  seed: 42
training:
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 5
  seed: 42
output_dir: experiments/valeval_bgem3
