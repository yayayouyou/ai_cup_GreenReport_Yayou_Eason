name: exp028_data_direct_pair_3way
model: configs/model/bert_pair_verifier_512.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: data/raw/vpesg_4k_train_1000.json
  val_split: 0.2
  seed: 42
pairing:
  mode: data_direct
training:
  seed: 42
  epochs: 10
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 3
output_dir: experiments/exp028_data_direct_pair_3way
