name: exp014_cw_both
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  class_weight: [promise_status, evidence_status]
  early_stopping_patience: 5
output_dir: experiments/exp014_cw_both
