name: full2000_roberta_wwm
model:      configs/model/roberta_wwm_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/train_plus_val_2000.json"
  val_split: 0.1
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
output_dir: experiments/full2000_roberta_wwm
