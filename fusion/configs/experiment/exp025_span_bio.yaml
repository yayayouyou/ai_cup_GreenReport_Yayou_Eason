name: exp025_span_bio
model:      configs/model/bert_ckip_span_bio.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  seed: 42
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  span_loss_weight: 0.5
output_dir: experiments/exp025_span_bio
