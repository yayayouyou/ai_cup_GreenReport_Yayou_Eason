name: exp033_bge_m3_lr1e5
model:      configs/model/bge_m3.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-5     # 568M XLM-R-large needs lower lr (2e-5 diverged on fold2/3)
  weight_decay: 0.01
  warmup_ratio: 0.1         # stabilize early-training divergence on the large model
  early_stopping_patience: 5
output_dir: experiments/exp033_bge_m3_lr1e5
