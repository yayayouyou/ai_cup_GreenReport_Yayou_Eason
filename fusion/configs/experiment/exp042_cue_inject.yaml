name: exp042_cue_inject
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/cue_inject.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  extra_tokens: ["[NUM]", "[DOC]", "[VAGUE]"]
output_dir: experiments/exp042_cue_inject
