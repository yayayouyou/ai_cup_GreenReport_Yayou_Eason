name: exp041a_st_promise_status
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  train_tasks: ["promise_status"]
output_dir: experiments/exp041a_st_promise_status
