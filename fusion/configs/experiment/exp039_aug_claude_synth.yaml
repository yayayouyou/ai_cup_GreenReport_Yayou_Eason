name: exp039_aug_claude_synth
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  augment: "data/augmented/claude_synth_combined.json"   # 100 Claude-generated Not Clear + evidence-No
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
output_dir: experiments/exp039_aug_claude_synth
