name: exp007_bert_512
model:      configs/model/bert_ckip_512.yaml
preprocess: configs/preprocess/baseline.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
output_dir: experiments/exp007_bert_512
