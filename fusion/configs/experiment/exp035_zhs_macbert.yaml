name: exp035_zhs_macbert
model:      configs/model/macbert_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/translated/train_zhs.json"   # OpenCC t2s (Traditional -> Simplified, data field replaced)
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
output_dir: experiments/exp035_zhs_macbert
