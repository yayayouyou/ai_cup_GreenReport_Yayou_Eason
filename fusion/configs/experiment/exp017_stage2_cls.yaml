name: exp017_stage2_cls
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  mode: cls
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  stage1_checkpoint: experiments/exp017_stage1_qa/best_model.pt
output_dir: experiments/exp017_stage2_cls
