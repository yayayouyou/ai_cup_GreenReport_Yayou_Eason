name: exp038_evidence_na_as_no
model:      configs/model/bert_ckip_base.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
training:
  epochs: 20
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  evidence_na_as_no: true   # fold evidence_status N/A into No for training; N/A via promise gate at inference
output_dir: experiments/exp038_evidence_na_as_no
