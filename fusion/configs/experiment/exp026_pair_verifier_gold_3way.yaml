name: exp026_pair_verifier_gold_3way
model:      configs/model/bert_pair_verifier.yaml
preprocess: configs/preprocess/fullwidth.yaml
data:
  train: "data/raw/vpesg_4k_train_1000.json"
  val_split: 0.2
  seed: 42
pairing:
  negative_ratio: 1
  negative_seed: 42
training:
  seed: 42
  epochs: 10
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  early_stopping_patience: 3
output_dir: experiments/exp026_pair_verifier_gold_3way
